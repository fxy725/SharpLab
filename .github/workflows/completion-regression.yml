name: Completion regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore locked regression dependencies
        run: dotnet restore tests/CompletionRegression/CompletionRegression.csproj --locked-mode -p:NuGetAudit=false
      - name: Run completion data loss regression tests
        run: dotnet test tests/CompletionRegression/CompletionRegression.csproj --no-restore --configuration Release --logger trx

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Use the validated npm version
        run: npm install --global npm@12.1.0 --no-audit --no-fund
      - name: Build stable editor dependency
        working-directory: source/#external/mirrorsharp/WebAssets
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build preview editor dependency
        working-directory: source/#external/mirrorsharp-codemirror-6-preview/WebAssets
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install frontend from the repaired lockfile
        working-directory: source/WebApp
        run: npm ci --no-audit --no-fund
      - name: Build and check the frontend
        working-directory: source/WebApp
        run: npm run build

